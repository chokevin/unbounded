# Project Signal's pinned, single-namespace Argo Workflows runtime.
controller:
  clusterWorkflowTemplates:
    enabled: false
  image:
    registry: quay.io
    repository: argoproj/workflow-controller
    tag: v4.1.5@sha256:328307c9436f40883b2e9ada14ca4082f062159818a1ca9a4e88577d5dbba257
  metricsConfig:
    enabled: false
  parallelism: 10
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi
  telemetryConfig:
    enabled: false
crds:
  full: true
  install: true
  keep: true
  upgradeJob:
    image:
      registry: quay.io
      repository: argoproj/argo-workflows-crdinstaller
      tag: v4.1.5@sha256:93534a0d0ba3ebd2965af08733852659130a3146a65a9746cbbf72250a92c9c9
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi
createAggregateRoles: false
executor:
  image:
    registry: quay.io
    repository: argoproj/argoexec
    tag: v4.1.5@sha256:8275c3b970f399e9264ebd5f57e17f554e7494046d0f36f5f05ae2570a601de2
images:
  pullPolicy: IfNotPresent
server:
  enabled: false
singleNamespace: true
workflow:
  rbac:
    create: false
