apiVersion: v1
kind: ServiceAccount
metadata:
  name: project-signal-central-prometheus
  namespace: project-signal
  labels:
    app.kubernetes.io/part-of: project-signal
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: project-signal-central-prometheus
  labels:
    app.kubernetes.io/part-of: project-signal
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: project-signal-central-prometheus
  labels:
    app.kubernetes.io/part-of: project-signal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: project-signal-central-prometheus
subjects:
  - kind: ServiceAccount
    name: project-signal-central-prometheus
    namespace: project-signal
