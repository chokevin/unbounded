apiVersion: v1
kind: ConfigMap
metadata:
  name: project-signal-central-prometheus
  namespace: project-signal
  labels:
    app.kubernetes.io/part-of: project-signal
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      external_labels:
        cluster: replace-with-actual-cluster-identifier
    scrape_configs:
      - job_name: project-signal-controller
        static_configs:
          - targets:
              - project-signal-controller-metrics.project-signal.svc:8080
      - job_name: project-signal-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - project-signal
            attach_metadata:
              node: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: "(.+)"
          - source_labels:
              - __address__
              - __meta_kubernetes_pod_annotation_prometheus_io_port
            action: replace
            regex: "([^:]+)(?::\\d+)?;(\\d+)"
            replacement: "$1:$2"
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_node_label_unbounded_cloud_io_site]
            target_label: provider
      - job_name: project-signal-prometheus
        static_configs:
          - targets:
              - 127.0.0.1:9090
---
apiVersion: v1
kind: Service
metadata:
  name: project-signal-central-prometheus
  namespace: project-signal
  labels:
    app.kubernetes.io/part-of: project-signal
spec:
  selector:
    app.kubernetes.io/name: project-signal-central-prometheus
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-signal-central-prometheus
  namespace: project-signal
  labels:
    app.kubernetes.io/name: project-signal-central-prometheus
    app.kubernetes.io/part-of: project-signal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: project-signal-central-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: project-signal-central-prometheus
        app.kubernetes.io/part-of: project-signal
    spec:
      serviceAccountName: project-signal-central-prometheus
      securityContext:
        fsGroup: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: quay.io/prometheus/prometheus@sha256:49214755b6153f90a597adcbff0252cc61069f8ab69ce8411285cd4a560e8038
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=24h
            - --storage.tsdb.retention.size=1GB
          ports:
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: project-signal-central-prometheus
        - name: data
          emptyDir:
            sizeLimit: 1Gi
