apiVersion: v1
kind: ConfigMap
metadata:
  name: project-signal-central-prometheus
  namespace: project-signal
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      external_labels:
        cluster: replace-with-actual-cluster-identifier
    scrape_configs:
      - job_name: project-signal-controller
        static_configs:
          - targets:
              - project-signal-controller-metrics.project-signal.svc:8080
      - job_name: project-signal-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - project-signal
            attach_metadata:
              node: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: "(.+)"
          - source_labels:
              - __address__
              - __meta_kubernetes_pod_annotation_prometheus_io_port
            action: replace
            regex: "([^:]+)(?::\\d+)?;(\\d+)"
            replacement: "$1:$2"
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_node_label_unbounded_cloud_io_site]
            target_label: provider
      - job_name: project-signal-prometheus
        static_configs:
          - targets:
              - 127.0.0.1:9090
    remote_write:
      - url: replace-with-internal-remote-write-url
        authorization:
          credentials_file: /var/run/project-signal-metrics/token
        write_relabel_configs:
          - source_labels: [__name__]
            regex: project_signal_.*|DCGM_FI_.*|prometheus_remote_storage_.*|up
            action: keep
